<footer class="bg-neutral py-24">
    <div id="contatti" class="container mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
            <!-- Contact Information -->
            <div>
                <h2 class="text-secondary text-4xl md:text-6xl font-bold mb-12">Contatti</h2>
                <div class="space-y-8">
                    <div class="flex gap-8">
                        <div>
                            <h3 class="text-secondary text-xl mb-2">Email</h3>
                            <p class="text-secondary text-lg">{{ features-remote._doc.footer.email }}</p>
                        </div>
                        <div>
                            <h3 class="text-secondary text-xl mb-2">Telefono</h3>
                            <p class="text-secondary text-lg">{{ features-remote._doc.footer.phone }}</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Map -->
            <div class="w-full h-[300px] rounded-2xl overflow-hidden">
                <iframe 
                    src="https://maps.google.com/maps?q={{ features-remote._doc.footer.location.latitude }},{{ features-remote._doc.footer.location.longitude }}&hl=es&z=14&amp;output=embed"
                    width="100%" 
                    height="100%" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>
</footer>
